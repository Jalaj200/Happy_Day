<!-- ═══════════════════════════════════════════════════════════════════════════
     Forever Us — Premium Cinematic Full-Screen Romantic Preloader Component
     ═══════════════════════════════════════════════════════════════════════════ -->
<div id="sitePreloader" class="cinematic-preloader" aria-label="Loading Forever Us">
    
    <!-- ── 1. Background Atmosphere: Radial Glows, Floating Hearts & Sparkles ── -->
    <div class="preloader-bg-glows" aria-hidden="true">
        <div class="preloader-orb preloader-orb-1"></div>
        <div class="preloader-orb preloader-orb-2"></div>
        <div class="preloader-orb preloader-orb-3"></div>
    </div>

    <div class="preloader-particles" aria-hidden="true">
        <span class="p-heart">💕</span>
        <span class="p-sparkle">✨</span>
        <span class="p-heart">💖</span>
        <span class="p-sparkle">🌸</span>
        <span class="p-heart">💗</span>
        <span class="p-sparkle">✨</span>
        <span class="p-heart">💕</span>
        <span class="p-sparkle">✨</span>
        <span class="p-heart">💖</span>
        <span class="p-sparkle">💗</span>
        <span class="p-heart">💕</span>
        <span class="p-sparkle">✨</span>
    </div>

    <!-- ── 2. Centered Content Container ── -->
    <div class="preloader-content">
        
        <!-- Top Glowing Circular Arc & Nestled Hearts -->
        <div class="preloader-arc-group">
            <div class="glowing-arc">
                <span class="arc-dot arc-dot-left">💖</span>
                <span class="arc-dot arc-dot-top">✨</span>
                <span class="arc-dot arc-dot-right">💖</span>
            </div>
            <div class="nestled-hearts-box">
                <span class="heart-primary animate-breathing">💖</span>
                <span class="heart-secondary animate-breathing-delayed">💗</span>
            </div>
        </div>

        <!-- Cursive Title with Neon Pink Glow & Heart Flourish -->
        <h1 class="preloader-logo-title">
            <span>Forever Us</span>
            <span class="logo-flourish">💕</span>
        </h1>

        <!-- Horizontal Decorative Divider -->
        <div class="preloader-divider">
            <span class="div-line"></span>
            <span class="div-heart">💖</span>
            <span class="div-line"></span>
        </div>

        <!-- Animated Loading Text Message -->
        <div class="preloader-msg-box">
            <span class="msg-heart">💕</span>
            <span id="preloaderMessage" class="preloader-msg-text">Loading beautiful memories...</span>
            <span class="msg-heart">💕</span>
        </div>

        <!-- Progress Percentage Display -->
        <div id="preloaderPercent" class="preloader-percent">0%</div>

        <!-- Premium Glassmorphism Progress Bar -->
        <div class="preloader-bar-container">
            <div class="preloader-bar-track">
                <div id="preloaderBarFill" class="preloader-bar-fill">
                    <div class="preloader-bar-shine"></div>
                    <div class="preloader-bar-heart-tip">💖</div>
                </div>
            </div>
        </div>

        <!-- Small Dot Indicator -->
        <div class="preloader-dots-indicator">
            <span class="dot-item">•</span>
            <span class="dot-item">•</span>
            <span class="dot-item">•</span>
            <span class="dot-heart">💕</span>
        </div>

        <!-- Bottom Message -->
        <p class="preloader-bottom-quote">
            Every moment with you is my favourite memory ❤️
        </p>

    </div>

</div>
