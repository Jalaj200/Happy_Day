<!-- ═══════════════════════════════════════════════════════════════════════════
     Forever Us — Premium Full-Screen Romantic Loading Screen (Reference Match)
     ═══════════════════════════════════════════════════════════════════════════ -->
<div id="premiumLoader" class="premium-loader" aria-label="Loading Forever Us">
    
    <!-- ── 1. Background Atmosphere: Gradient, Pink Glows & Bokeh ── -->
    <div class="loader-bg-glows" aria-hidden="true">
        <div class="glow-orb orb-center"></div>
        <div class="glow-orb orb-left"></div>
        <div class="glow-orb orb-right"></div>
        <div class="bokeh-light bokeh-1"></div>
        <div class="bokeh-light bokeh-2"></div>
        <div class="bokeh-light bokeh-3"></div>
        <div class="bokeh-light bokeh-4"></div>
    </div>

    <!-- ── 2. Floating Hearts, Soft Sparkles & Subtle Particles ── -->
    <div class="loader-particles" aria-hidden="true">
        <!-- Floating Hearts -->
        <span class="l-heart h-1">💕</span>
        <span class="l-heart h-2">💖</span>
        <span class="l-heart h-3">💗</span>
        <span class="l-heart h-4">💕</span>
        <span class="l-heart h-5">💖</span>
        <span class="l-heart h-6">💗</span>
        <span class="l-heart h-7">💕</span>
        <span class="l-heart h-8">💖</span>

        <!-- Twinkling Sparkles -->
        <span class="l-sparkle s-1">✨</span>
        <span class="l-sparkle s-2">💫</span>
        <span class="l-sparkle s-3">✨</span>
        <span class="l-sparkle s-4">•</span>
        <span class="l-sparkle s-5">★</span>
        <span class="l-sparkle s-6">✨</span>
        <span class="l-sparkle s-7">💫</span>
        <span class="l-sparkle s-8">•</span>
    </div>

    <!-- ── 3. Center Content Container (Perfectly Centered) ── -->
    <div class="loader-content-center">

        <!-- Top: Two glowing pink hearts inside a glowing circular arc -->
        <div class="loader-top-emblem">
            <div class="glowing-circular-arc">
                <span class="arc-sparkle arc-start">💖</span>
                <span class="arc-sparkle arc-peak">✨</span>
                <span class="arc-sparkle arc-end">💖</span>
            </div>
            <div class="two-glowing-hearts">
                <span class="heart-big">💖</span>
                <span class="heart-small">💕</span>
            </div>
        </div>

        <!-- Middle: Forever Us in elegant cursive with neon breathing glow -->
        <div class="loader-middle-brand">
            <h1 class="brand-title-cursive">Forever Us</h1>
            <!-- Small decorative heart flourish -->
            <div class="decorative-flourish">
                <span class="flourish-line"></span>
                <span class="flourish-dot"></span>
                <span class="flourish-heart">♥</span>
                <span class="flourish-dot"></span>
                <span class="flourish-line"></span>
            </div>
        </div>

        <!-- Below: Rotating loading messages -->
        <div class="loader-message-container">
            <span class="msg-heart-icon">💖</span>
            <span id="loaderMessageText" class="loader-message-text">Loading beautiful memories...</span>
            <span class="msg-heart-icon">💖</span>
        </div>

        <!-- Below that: Percentage above bar & Premium Glassmorphism Progress Bar -->
        <div class="loader-progress-section">
            <div id="loaderPercentDisplay" class="loader-percent-val">0%</div>
            
            <div class="glass-progress-track">
                <!-- Progress Fill Bar with Gradient & Animated Glossy Shine -->
                <div id="loaderProgressFill" class="glass-progress-fill" style="width: 0%;">
                    <div class="animated-glossy-shine"></div>
                    <!-- Heart icon at the very end of the progress fill -->
                    <div class="progress-end-heart">💖</div>
                </div>
            </div>
            
            <div class="progress-dots-flourish" aria-hidden="true">
                <span>•</span>
                <span>•</span>
                <span class="dot-heart">♥</span>
                <span>•</span>
                <span>•</span>
            </div>
        </div>

        <!-- Bottom: Romantic caption -->
        <div class="loader-bottom-caption">
            <p>"Every moment with you is my favourite memory ❤️"</p>
        </div>

    </div>

</div>
